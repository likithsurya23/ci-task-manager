name: SAM CLI Cache Test
 
on: [push, workflow_dispatch]
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Cache SAM CLI
        id: cache-sam
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/lib/python3.11/site-packages
          key: sam-cli-${{ runner.os }}-v1
 
      - name: Install SAM CLI
        run: |
          if ! command -v sam &> /dev/null; then
            pip install --user aws-sam-cli
          fi
 
      - name: Check version and time
        run: |
          time sam --version
          echo "Cache hit: ${{ steps.cache-sam.outputs.cache-hit }}"
